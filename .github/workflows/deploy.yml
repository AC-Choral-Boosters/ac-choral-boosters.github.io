# Builds the site from the live Google Sheet and publishes it to GitHub Pages.
# Runs on every push to main, every hour at minute 17, monthly for the keepalive,
# and on demand (Actions tab > Deploy > Run workflow).
# If the build fails (for example, the Sheet is unreachable), nothing is deployed
# and the last good site stays live.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # hourly rebuild, so Sheet edits go live within about an hour
    - cron: '47 9 1 * *' # monthly keepalive (see the keepalive job below)
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A queued run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Provides the site address: https://<org>.github.io + /<repo> until a custom
      # domain is set in Settings > Pages, then the domain with no base path.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build from the live Sheet
        run: npm run build
        env:
          DATA_SOURCE: live
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub turns off scheduled workflows in public repos after 60 days without
  # repository activity. Once a month this re-enables the workflow through GitHub's
  # API, which is meant to keep the hourly schedule alive without dummy commits.
  # GitHub does not document this as a guaranteed fix, so it is best effort: if it
  # fails, the deploy is unaffected. See README "Keeping the hourly schedule on".
  keepalive:
    if: github.event.schedule == '47 9 1 * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        continue-on-error: true
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
